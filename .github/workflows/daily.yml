name: Daily HN Digest

'on':
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Run HN Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx

      - name: Pre-flight smoke tests
        run: pytest tests/test_models.py tests/test_store.py

      - name: Run HN Filter Digest
        run: python -m hnfilter.main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit and push updated seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/seen.json
          git diff --staged --quiet || git commit -m "chore(state): update seen.json [skip ci]"
          git push origin main

      - name: Notify Discord on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            PAYLOAD=$(python3 -c "import json, os; print(json.dumps({'content': f'⚠️ **HN Digest Failed**: {os.environ[\"RUN_URL\"]} '}))")
            curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          else
            echo "DISCORD_WEBHOOK_URL is not set; skipping failure notification."
          fi
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
